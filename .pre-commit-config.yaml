# Every hook runs the project's own tool, through scripts/run-tool.
#
# ruff used to come from ruff-pre-commit at its own pinned rev, which meant
# two ruffs: that one on commit, and the project's on `mise run check` and on
# anything run by hand. They drifted, and the symptom was a file the hook had
# formatted being reformatted the other way a moment later. There is now one
# ruff -- the one in uv.lock -- so the commit gate and the developer get the
# same answer.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: scripts/run-tool ruff check --fix
        language: script
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff-format
        entry: scripts/run-tool ruff format
        language: script
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: scripts/run-tool mypy src tests
        language: script
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: scripts/run-tool pytest
        language: script
        pass_filenames: false
        stages: [pre-push]
