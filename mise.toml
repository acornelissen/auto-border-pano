[tools]
python = "3.13.13"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install dependencies"
run = ["uv sync", "uv run pre-commit install --hook-type pre-commit --hook-type pre-push"]

[tasks.gui]
description = "Launch the GUI"
run = "uv run maskingframe-gui"

[tasks.split]
description = "Run the CLI"
run = "uv run maskingframe"

[tasks.test]
description = "Run tests"
run = "uv run pytest"

[tasks.lint]
description = "Lint"
run = "uv run ruff check ."

[tasks.fmt]
description = "Format"
run = "uv run ruff format ."

# The gate has to agree with the commit hook, which formats. Without this,
# `mise run check` passed on a tree the hook would then rewrite.
[tasks.fmtcheck]
description = "Check formatting"
run = "uv run ruff format --check ."

[tasks.typecheck]
description = "Type check"
run = "uv run mypy src tests"

[tasks.check]
description = "Lint, check formatting, type check and test"
depends = ["lint", "fmtcheck", "typecheck", "test"]
