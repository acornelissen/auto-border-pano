[project]
name = "maskingframe"
version = "0.2.0"
description = "Cut panoramas into Instagram carousels, and compose diptychs and triptychs"
requires-python = ">=3.13"
dependencies = [
    "Pillow>=10.0.0",
    "pyside6>=6.8",
    # `work.py` asks shiboken whether a widget's C++ half is still there.
    # It arrives with pyside6 in practice, but the code imports it by name,
    # so it is named here rather than relied on as a transitive.
    "shiboken6>=6.8",
]

[project.scripts]
maskingframe = "maskingframe.cli:main"
maskingframe-gui = "maskingframe.cli:gui_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskingframe"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest-qt>=4.5.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Newer ruff formats Python inside Markdown fences, which would rewrite the
# code samples in the plan and design documents. Those are a record of what
# was decided and when, not source -- reflowing them churns history and makes
# a plan disagree with the session that produced it.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
