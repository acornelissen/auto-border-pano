[project]
name = "maskingframe"
version = "0.2.0"
description = "Cut panoramas into Instagram carousels, and compose diptychs and triptychs"
requires-python = ">=3.13"
dependencies = [
    "Pillow>=10.0.0",
    "pyside6>=6.8",
]

[project.scripts]
maskingframe = "maskingframe.cli:main"
maskingframe-gui = "maskingframe.cli:gui_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskingframe"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest-qt>=4.5.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
