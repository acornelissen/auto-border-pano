[project]
name = "auto-border-pano"
version = "0.2.0"
description = "Split panoramic images into social-media-ready square formats"
requires-python = ">=3.13"
dependencies = ["Pillow>=10.0.0"]

[project.scripts]
pano-split = "auto_border_pano.cli:main"
pano-split-gui = "auto_border_pano.cli:gui_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_border_pano"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Legacy pre-refactor scripts are extracted into src/ in a later task; do not
# lint or reformat them here.
extend-exclude = ["panorama_splitter.py", "panorama_splitter_gui.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
